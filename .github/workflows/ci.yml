name: CloudOps AI Agent CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Full Pytest Suite (MCP + Agent + Backend)
        run: |
          pytest tests -v --tb=short

  docker-build:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AWS MCP Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: mcp-servers/aws/Dockerfile
          push: false
          tags: cloudops-aws-mcp:latest

      - name: Build GitHub MCP Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: mcp-servers/github/Dockerfile
          push: false
          tags: cloudops-github-mcp:latest

      - name: Build Docker MCP Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: mcp-servers/docker/Dockerfile
          push: false
          tags: cloudops-docker-mcp:latest

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: cloudops-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          push: false
          tags: cloudops-frontend:latest
